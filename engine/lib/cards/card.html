<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Intro/outro card. Everything moves with CSS animations; render-overlays.mjs pauses
     them and steps document.getAnimations() frame by frame. Fonts are injected as
     @font-face data URIs by the renderer. Theme colours come from video.json. -->
<style>
/*FONTS*/
:root {
  --ground: #F5F8FB; --ink: #0D1424; --slate: #3D5378; --line: #7D8CAB; --mark: #D4FF3A;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
body { font-family: "Atkinson Hyperlegible Next", sans-serif; color: var(--ink); position: relative; }
.rule { position: absolute; left: 0; right: 0; top: 0; height: 100%; opacity: .5;
  background-image: linear-gradient(to right, rgba(125,140,171,.16) 1px, transparent 1px);
  background-size: 120px 100%; animation: drift 6s linear both; }
@keyframes drift { from { transform: translateX(0); } to { transform: translateX(-120px); } }
.wrap { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 220px; }
.logo { display: flex; align-items: center; gap: 18px; font: 700 36px "Bricolage Grotesque", sans-serif; letter-spacing: -.01em;
  opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) .1s both; }
.logo i { width: 34px; height: 34px; border-radius: 9px; background: var(--ink); position: relative; display: block; }
.logo i::after { content: ""; position: absolute; left: 7px; right: 7px; bottom: 8px; height: 8px; border-radius: 3px; background: var(--mark); }
h1 { font: 800 112px/1.04 "Bricolage Grotesque", sans-serif; letter-spacing: -.025em; max-width: 1400px; margin-top: 56px; }
h1 .line { display: block; overflow: hidden; padding-bottom: .08em; }
h1 .line span { display: inline-block; opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) both; }
h1 mark { background: linear-gradient(var(--mark), var(--mark)) no-repeat 0 88% / 0% 46%; color: inherit; animation: sweep .8s cubic-bezier(.6,0,.2,1) 1.15s both; }
.sub { margin-top: 36px; font-size: 40px; line-height: 1.35; color: var(--slate); max-width: 1200px; opacity: 0; animation: up .8s cubic-bezier(.2,.7,.2,1) 1.0s both; }
.url { margin-top: 56px; font: 500 30px "JetBrains Mono", monospace; color: var(--ink); opacity: 0; animation: up .8s cubic-bezier(.2,.7,.2,1) 1.4s both; }
.url b { background: var(--mark); padding: 2px 12px; border-radius: 6px; font-weight: 500; }
/* Persian card: Vazirmatn (Bricolage and Atkinson have no Arabic-script glyphs), right to left, taller lines */
.rtl h1 { font: 700 104px/1.32 "Vazirmatn", "Bricolage Grotesque", sans-serif; letter-spacing: 0; }
.rtl .sub { font-family: "Vazirmatn", "Atkinson Hyperlegible Next", sans-serif; line-height: 1.6; }
.rtl .url { direction: ltr; text-align: right; }
.rtl h1 mark { background-position: 100% 88%; } /* the marker sweeps with the reading direction */
.rtl h1 .line { padding: .12em 0 .3em; margin: -.12em 0 -.3em; } /* the rise clips Persian ascenders/descenders in a tight box */
@keyframes up { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(70%); } to { opacity: 1; transform: none; } }
@keyframes sweep { to { background-size: 100% 46%; } }
</style>
</head>
<body>
<div class="rule"></div>
<div class="wrap">
  <div class="logo"><i></i><span id="brand"></span></div>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>
  <p class="url" id="url"></p>
</div>
<script>
// window.CARD = { brand, title, subtitle, url, mark }  (set by the renderer)
const c = window.CARD;
if (/[\u0600-\u06FF]/.test((c.title || "") + (c.subtitle || ""))) {
  document.documentElement.lang = "fa"; document.documentElement.dir = "rtl"; document.body.classList.add("rtl");
}
document.getElementById("brand").textContent = c.brand || "";
const h1 = document.getElementById("title");
const words = (c.title || "").split(" ");
// highlighted phrase: the last two words, swept by the marker
const split = Math.max(0, words.length - 2);
const lines = [words.slice(0, split).join(" "), words.slice(split).join(" ")].filter(Boolean);
lines.forEach((t, i) => {
  const l = document.createElement("span"); l.className = "line";
  const s = document.createElement("span"); s.style.animationDelay = (0.3 + i * 0.18) + "s";
  if (i === lines.length - 1 && c.mark !== false) { const m = document.createElement("mark"); m.textContent = t; s.appendChild(m); } else s.textContent = t;
  l.appendChild(s); h1.appendChild(l);
});
document.getElementById("subtitle").textContent = c.subtitle || "";
if (c.url) { const u = document.getElementById("url"); const b = document.createElement("b"); b.textContent = c.url; u.appendChild(b); }
else document.getElementById("url").remove();
if (!c.subtitle) document.getElementById("subtitle").remove();
</script>
</body>
</html>
